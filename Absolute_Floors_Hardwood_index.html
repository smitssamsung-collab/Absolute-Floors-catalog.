<head>
<meta charset="utf-8">

<title>Absolute Floors · Hardwood Collection</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1a16;--muted:#6b665d;--line:#e2ddd3;--accent:#5a3a1e;--chip:#efe8dc;--good:#6b7f5a;--better:#8a5a2b;--best:#1f2f4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:12px 16px}
header .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
header h1{margin:2px 0 8px;font-size:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input,.bar select{font:inherit;padding:9px 12px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.12);color:#fff;min-width:0}
.bar input{flex:1 1 160px}
.bar input::placeholder{color:rgba(255,255,255,.7)}
.bar select{flex:0 1 auto;max-width:48%}
.bar select option{color:#000}
.bar button{font:inherit;padding:9px 12px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:transparent;color:#fff}
.bar button.on{background:#fff;color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:12px 16px 90px}
.count{font-size:12px;color:var(--muted);margin:4px 0 10px}
h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.sw img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e6e0d6}
.sw .n{padding:7px 9px 3px;font-weight:600;font-size:14px;line-height:1.2}
.sw .m{padding:0 9px 8px;font-size:12px;color:var(--muted)}
.sw .pick{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)}
.sw.sel{outline:3px solid var(--accent)}
.sw.sel .pick{background:var(--accent);color:#fff}
.hidden{display:none}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#lb.open{display:flex}
#lb .box{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:92vh;overflow:auto}
#lb img{width:100%;max-height:70vh;object-fit:contain;display:block;background:#eee}
#lb .cap{padding:12px 16px}
#lb .cap b{font-size:18px}
#lb .cap div{color:var(--muted);font-size:14px;margin-top:2px}
#lb .x{position:absolute;top:14px;right:16px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px}
/* compare tray */
#tray{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:none;gap:10px;align-items:center;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#tray.open{display:flex}
#tray .slots{display:flex;gap:6px;flex:1}
#tray .slot{width:44px;height:44px;border-radius:8px;background:#eee;border:1px dashed var(--line);overflow:hidden}
#tray .slot img{width:100%;height:100%;object-fit:cover}
#tray button{font:inherit;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700}
#tray button.ghost{background:transparent;color:var(--muted)}
/* compare view */
#cmp{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto}
#cmp.open{display:block}
#cmp header{position:sticky}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px;max-width:1100px;margin:0 auto}
.col{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.col .tier{padding:8px 10px;color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.col:nth-child(1) .tier{background:var(--good)}
.col:nth-child(2) .tier{background:var(--better)}
.col:nth-child(3) .tier{background:var(--best)}
.col img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e6e0d6}
.col .nm{padding:10px 10px 4px;font-weight:700;font-size:15px;line-height:1.2}
.col .rows{padding:0 10px 10px}
.col .rows div{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.col .rows div:last-child{border:0}
.col .rows span:first-child{color:var(--muted)}
.col .rows span:last-child{text-align:right}
.col .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:640px){.cols{grid-template-columns:1fr}.col img{aspect-ratio:16/9}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 16px 10px}
</style>
</head>

const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.forEach((d,i)=>d.id=i);
function fill(sel,vals){[...new Set(vals.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)})}
fill($('#vendor'),DATA.map(d=>d.vendor));
fill($('#species'),DATA.map(d=>d.species));
let compare=false, picks=[];
function render(){
  const q=$('#q').value.toLowerCase().trim(), v=$('#vendor').value, sp=$('#species').value;
  const rows=DATA.filter(d=>(!v||d.vendor===v)&&(!sp||d.species===sp)&&(!q||[d.vendor,d.collection,d.color,d.species,d.widths,d.construction,d.finish].join(' ').toLowerCase().includes(q)));
  $('#count').textContent=rows.length+' of '+DATA.length+' colors';
  const groups={};rows.forEach(d=>{const k=d.vendor+'|'+d.collection;(groups[k]=groups[k]||[]).push(d)});
  $('#list').innerHTML=Object.entries(groups).map(([k,arr])=>{const a=arr[0];
    return `<h2><span>${esc(a.vendor)} · ${esc(a.collection)}</span><small>${esc([a.widths,a.construction,a.finish].filter(Boolean).join(' · '))}</small></h2>

['q','vendor','species'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
$('#list').addEventListener('click',e=>{const el=e.target.closest('.sw');if(!el)return;const d=DATA[+el.dataset.id];

  $('#lbi').src=d.image;$('#lbn').textContent=d.color;$('#lbm').textContent=[d.vendor+' · '+d.collection,d.species,d.widths,d.construction,d.finish].filter(Boolean).join(' · ');$('#lb').classList.add('open')});

$('#cmpMode').onclick=()=>{compare=!compare;$('#cmpMode').classList.toggle('on',compare);if(!compare)picks=[];render();tray()};
$('#clear').onclick=()=>{picks=[];render();tray()};
function showCmp(){const names=['Good','Better','Best'];$('#cols').innerHTML=[0,1,2].map(i=>{const d=DATA[picks[i]];
  return `<div class="col"><div class="tier">${names[i]}</div>${d?`<img src="${esc(d.image)}" alt=""><div class="nm">${esc(d.color)}</div><div class="rows">
  <div><span>Brand</span><span>${esc(d.vendor)}</span></div><div><span>Collection</span><span>${esc(d.collection)}</span></div><div><span>Species</span><span>${esc(d.species)}</span></div>
  <div><span>Width</span><span>${esc(d.widths||'—')}</span></div><div><span>Construction</span><span>${esc(d.construction||'—')}</span></div><div><span>Finish</span><span>${esc(d.finish||'—')}</span></div></div>`:`<div class="empty">—</div>`}</div>`}).join('');$('#cmp').classList.add('open');window.scrollTo(0,0)}
$('#show').onclick=showCmp;
$('#back').onclick=()=>$('#cmp').classList.remove('open');
$('#swap').onclick=()=>{picks.push(picks.shift());showCmp();render();tray()};
render();
</script>
</body>
</html>
